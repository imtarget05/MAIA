# MAIA infra — stateful backing service, luôn cần cho mọi profile.
# Chạy lẻ: docker compose -f deploy/docker/compose.infra.yml -f deploy/docker/compose.app.yml up -d
# (chạy từ repo root; KHÔNG đặt `name:` để giữ nguyên volumes/network của project mặc định)

services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: maia-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_data:
