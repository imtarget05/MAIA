# MAIA UI — Streamlit frontend. Cùng image với api/worker (Dockerfile duy nhất).
# Vào full stack mặc định: docker compose up -d  (http://localhost:8501)
# Chạy lẻ: docker compose -f deploy/docker/compose.infra.yml -f deploy/docker/compose.app.yml -f deploy/docker/compose.ui.yml up -d
# MAIA_API_URL trỏ service `api` trong network chung (app gọi API server-side nên dùng tên service).

services:
  streamlit:
    build:
      context: ../..
    container_name: maia-ui
    ports:
      - "8501:8501"
    depends_on:
      - api
    environment:
      - MAIA_API_URL=http://api:8000
      - QDRANT_URL=http://qdrant:6333
      - MAIA_MODE=mock
      - MAIA_EMBED_FORCE_HASH=1
      - STORAGE_DIR=/app/storage
    volumes:
      - ../../storage:/app/storage
      - ../../data:/app/data:ro
    command: ["streamlit", "run", "app_streamlit.py", "--server.address", "0.0.0.0", "--server.port", "8501"]
    restart: unless-stopped
