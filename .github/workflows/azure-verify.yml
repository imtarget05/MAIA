name: Azure Verify (manual — OIDC + transient)

# THE CREDENTIAL BLOCKER GATE. Everything else in this repo runs without an
# Azure subscription; this workflow is the only place the secretless path is
# actually exercised.
#
# WHAT IT PROVES, AND WHAT IT DOES NOT:
#   * `oidc-login` proves GitHub -> Entra federation works with NO client
#     secret. This is the Phase 2 exit-gate item "OIDC works".
#   * `oidc-negative-control` proves the federation is actually CONSTRAINED.
#     The same client id and the same token, but WITHOUT the `azure-verify`
#     environment, must FAIL — because the federated credential's subject is
#     `repo:imtarget05/MAIA:environment:azure-verify`. Without this job, a
#     wildcard subject would look identical to a correct one.
#   * `terraform-plan` proves remote state works and the plan is clean.
#   * `transient-verify` (opt-in) applies, reads the live control plane, then
#     DESTROYS. Opt-in because it creates billable resources.
#
# A green run here is evidence about the DEPLOY PATH. It is not evidence that
# MAIA's application works; nothing in this workflow starts the API.
#
# COST: the default path is read-only (login + plan). Only
# `workflow_dispatch.inputs.apply` = true creates anything, and that job
# destroys in the same run.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Terraform environment to target
        type: choice
        default: validation
        options: [dev, validation, prod]
      apply:
        description: "APPLY + VERIFY + DESTROY (creates billable resources)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Two concurrent applies would fight over the same state blob lease and, worse,
  # could leave a half-destroyed stack. Serialise.
  group: azure-verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  oidc-login:
    name: OIDC login (no client secret)
    runs-on: ubuntu-latest
    # The environment is part of the federated credential SUBJECT, so declaring
    # it here is what changes the OIDC token's `sub` claim — and therefore what
    # makes this job authorised. Removing it makes the job fail, by design.
    environment: azure-verify
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Pinned by SHA for the same reason as every other action here: a tag is
      # mutable, and this action receives the OIDC token.
      - name: Azure login via OIDC
        uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Not "the job succeeded" — WHICH identity it became. `az account show`
      # output is the Definition of Done for the credential blocker, so it is
      # uploaded rather than scrolled past.
      - name: Show the account we actually got
        run: az account show --output json

      # Belt and braces against a well-meaning future edit adding a client
      # secret to the login step. This runs the SAME probe the offline gate
      # runs, rather than a second, weaker grep: two checks for one property is
      # one too many, and the weaker one is the one that gets remembered.
      - name: Assert the deploy path is still secretless
        working-directory: infra/terraform
        run: python3 tests/probe_no_client_secret.py

  oidc-negative-control:
    name: OIDC negative control (wrong subject must be REJECTED)
    runs-on: ubuntu-latest
    # NO `environment:` here on purpose — that absence is what changes the OIDC
    # token's `sub` claim away from the federated credential's subject.
    permissions:
      contents: read
      id-token: write
    steps:
      # WHY continue-on-error: WITHOUT it, the expected rejection fails this
      # step, fails this job, and turns the whole workflow RED for the right
      # reason but the wrong outcome — "we expected a rejection and got a
      # workflow failure" reads identically to "the control is broken".
      #
      # WHY that alone is NOT enough (the assert below is not optional):
      # `continue-on-error: true` without an assertion is a control that can
      # never fail. If the federated credential were over-broad and this login
      # SUCCEEDED, continue-on-error would swallow it and the workflow would go
      # green. Only the explicit outcome check makes that a red build.
      #
      # WHY THERE IS ALSO A REASON CHECK — measured, not theorised. On the first
      # real run the POSITIVE login failed (wrong subject format) and this job
      # still went GREEN, because "login failed" was true. That is a false pass:
      # the control proved a login failed without proving it failed *for the
      # intended reason*. A negative control that cannot distinguish
      # "correctly rejected" from "broken for an unrelated cause" is not a
      # control at all. So the assertion below requires the Azure error to be
      # specifically AADSTS700211 (no matching federated identity record);
      # anything else is a different bug and must not be reported as enforcement.
      #
      #   correct subject restriction  -> fails with AADSTS700211 -> GREEN
      #   over-broad credential       -> login SUCCEEDS            -> RED
      #   unrelated breakage          -> fails for another reason  -> RED
      # WHY THE REPO-SCOPED FALLBACK — measured on the first real run. The three
      # identifiers live as ENVIRONMENT variables, and this job deliberately has
      # no `environment:`, so `${{ vars.AZURE_* }}` resolved empty and `az login
      # --tenant ''` failed with "Tenant 'v2.0' not found" — a false rejection
      # caused by a missing variable, not by the subject restriction.
      #
      # So this job reads the repo-level copies, which are visible to every job
      # regardless of environment. That is deliberate: the control must reach
      # Azure with valid credentials so the ONLY thing that can reject it is the
      # subject mismatch. If the identifiers are absent here, the job fails
      # loudly instead of reporting a meaningless rejection.
      - name: Require the identifiers this control depends on
        env:
          CID: ${{ vars.AZURE_CLIENT_ID }}
          TID: ${{ vars.AZURE_TENANT_ID }}
        run: |
          if [ -z "$CID" ] || [ -z "$TID" ]; then
            echo "::error::repo-level AZURE_CLIENT_ID / AZURE_TENANT_ID are empty."
            echo "::error::Set them with: gh variable set --repo imtarget05/MAIA <name>"
            exit 1
          fi
          echo "identifiers present"

      - name: Mint the token and exchange it ourselves
        # Not azure/login: we need the Azure error TEXT to assert on the reason,
        # and azure/login does not expose its output as a step artifact.
        # Same underlying mechanism (OIDC token -> federated exchange); only the
        # wrapper differs, and the token itself is read from the Actions OIDC
        # endpoint, exactly as azure/login does.
        id: probe
        env:
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: |
          set +e
          # WHY jq AND NOT `curl -w`: the previous attempt appended a marker to the
          # body and stripped it with sed, which still handed `az login` a token
          # that Entra rejected as AADSTS50027 "JWT malformed" — while the body
          # itself decoded fine. Any string surgery on the token risks corrupting
          # it, and a corrupted token produces a failure that looks like a
          # policy decision. jq extracts .value untouched.
          TOKEN="$(curl -sS \
                    -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                    "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange" \
                    | jq -r '.value // empty')"

          if [ -z "$TOKEN" ]; then
            echo "::error::no OIDC token was issued; nothing was exchanged with Azure."
            TOKEN_RAW="$(curl -sS \
                    -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                    "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange")"
            echo "raw response: $TOKEN_RAW"
            echo "outcome=notoken" >> "$GITHUB_OUTPUT"
            echo "log=/dev/null" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The sub claim is the evidence that this token really is the
          # wrong-subject one. Printing it means a reader can see the mismatch
          # instead of taking the rejection on faith.
          SUB="$(printf '%s' "$TOKEN" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null \
                 | grep -o '"sub":"[^"]*"' | cut -d'"' -f4)"
          echo "PRESENTED SUBJECT CLAIM: ${SUB:-<undecodable>}"
          if [ -z "$SUB" ]; then
            echo "::error::could not decode the sub claim; cannot prove which subject was presented."
            echo "outcome=notoken" >> "$GITHUB_OUTPUT"
            echo "log=/dev/null" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s' "$SUB" | grep -q ':environment:'; then
            echo "::error::this token carries an :environment: claim, so it is NOT the wrong-subject case."
            echo "outcome=notoken" >> "$GITHUB_OUTPUT"
            echo "log=/dev/null" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          az login --service-principal \
                   -u "$ARM_CLIENT_ID" \
                   --tenant "$ARM_TENANT_ID" \
                   --federated-token "$TOKEN" \
                   --allow-no-subscriptions >"$RUNNER_TEMP/login.log" 2>&1
          rc=$?
          echo "az_login_exit=$rc"
          cat "$RUNNER_TEMP/login.log"
          echo "log=$RUNNER_TEMP/login.log" >> "$GITHUB_OUTPUT"
          # The REAL result, from the exit code. Writing a constant here would
          # make the assertion downstream meaningless — it would report what
          # this file says rather than what az actually did.
          echo "outcome=$([ $rc -eq 0 ] && echo success || echo failure)" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Assert the login was REJECTED, and for the RIGHT reason
        # `outcome` is computed from az's real exit code. Asserting on a value
        # continue-on-error rewrote would be the same defect in subtler form.
        env:
          LOGIN_LOG: ${{ steps.probe.outputs.log }}
          LOGIN_OUTCOME: ${{ steps.probe.outputs.outcome }}
        run: |
          echo "azure/login outcome without the environment: ${LOGIN_OUTCOME}"
          echo "--- presented token / azure error ---"
          cat "$LOGIN_LOG" 2>/dev/null || echo "(no log captured)"

          # No token at all means the exchange never happened, so the subject
          # restriction was never exercised. That is NOT enforcement.
          if [ "$LOGIN_OUTCOME" = "notoken" ]; then
            echo "::error::no OIDC token was issued; the exchange never reached Azure."
            exit 1
          fi

          # An over-broad credential LOGS IN successfully here. That is the one
          # failure mode that must never be reported as enforcement.
          if [ "$LOGIN_OUTCOME" = "success" ]; then
            echo "::error::OIDC login SUCCEEDED without the azure-verify environment."
            echo "::error::The federated credential subject is not constraining the token."
            exit 1
          fi

          # A failure is only evidence of enforcement if it is the RIGHT
          # failure. AADSTS700211 = "No matching federated identity record".
          if grep -q "AADSTS700211" "$LOGIN_LOG"; then
            echo "PASS: rejected with AADSTS700211 (no matching federated identity record)."
            echo "      Intended reason confirmed: the subject does not match."
          else
            echo "::error::The login failed, but NOT with AADSTS700211."
            echo "::error::The failure is real but is NOT the subject restriction being"
            echo "::error::enforced, so this run proves nothing about restriction."
            exit 1
          fi

      - name: Record the enforcement
        run: >-
          echo "subject restriction enforced: the credential accepts
          repo:imtarget05/MAIA:environment:azure-verify and rejects everything else."

  terraform-plan:
    name: Remote state + plan invariants
    needs: [oidc-login, oidc-negative-control]
    runs-on: ubuntu-latest
    environment: azure-verify
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.16.3"
          terraform_wrapper: false

      - name: Azure login via OIDC
        uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # The backend reads ARM_* for BOTH the management and the data plane.
      # backend.hcl deliberately does NOT hardcode `use_oidc` (that would force
      # the GitHub-only OIDC path and break a local `az login` init), so these
      # variables ARE the CI authentication mechanism. One backend config, two
      # paths: `az login` locally, ARM_* here.
      #
      # These are identifiers, not secrets. There is no ARM_CLIENT_SECRET and
      # adding one would fail tests/probe_no_client_secret.py.
      - name: Init against the remote backend
        working-directory: infra/terraform
        env:
          ARM_USE_OIDC: "true"
          ARM_USE_AZUREAD_AUTH: "true"
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          terraform init -input=false -reconfigure \
            -backend-config=environments/${{ inputs.environment }}/backend.hcl

      - name: Prove the state is remote, not local
        working-directory: infra/terraform
        run: |
          if ls ./*.tfstate* >/dev/null 2>&1; then
            echo "::error::a local .tfstate exists — the remote backend is not in use"
            ls -la ./*.tfstate*
            exit 1
          fi
          echo "no local state file"
          terraform state pull >/dev/null && echo "remote state reachable"

      - name: Plan and check the invariants
        working-directory: infra/terraform
        run: |
          terraform plan -input=false -lock=false \
            -var-file=environments/${{ inputs.environment }}/terraform.tfvars -out=tfplan
          terraform show -json tfplan >plan.json
          python3 tests/check_plan_invariants.py plan.json

      - name: Upload plan evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: azure-verify-plan-${{ inputs.environment }}
          path: |
            infra/terraform/plan.json
            infra/terraform/tfplan
          if-no-files-found: warn
          retention-days: 30

  transient-verify:
    name: Transient apply + verify + destroy
    needs: [oidc-login, oidc-negative-control]
    if: inputs.apply
    runs-on: ubuntu-latest
    environment: azure-verify
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.16.3"
          terraform_wrapper: false

      - name: Azure login via OIDC
        uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # scripts/transient_verify.sh arms `trap destroy EXIT` BEFORE it applies,
      # so this job cannot leave a billable stack behind — not on success, not
      # on failure, not when the runner is cancelled.
      - name: Apply, verify, destroy
        working-directory: infra/terraform
        env:
          # Same reason as the terraform-plan job: backend.hcl carries no
          # `use_oidc`, so CI authentication comes from ARM_* here.
          ARM_USE_OIDC: "true"
          ARM_USE_AZUREAD_AUTH: "true"
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          EVIDENCE_DIR: ${{ github.workspace }}/docs/evidence/terraform-verify/${{ inputs.environment }}
        run: ./scripts/transient_verify.sh ${{ inputs.environment }}

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: azure-verify-run-${{ inputs.environment }}
          path: docs/evidence/terraform-verify/${{ inputs.environment }}
          if-no-files-found: warn
          retention-days: 90