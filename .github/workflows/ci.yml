name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # Pinned: unpinned `ruff`/`pyright` drifted (0.16.x flags 200+
          # pre-existing intentional patterns) && broke this job on every
          # push. Versions below are verified green against pyproject policy.
          pip install "ruff==0.16.6" "pyright==1.1.413"
      - name: Run ruff
        run: ruff check src/
      - name: Run pyright
        run: pyright src/

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest
      - name: Run unit tests
        env:
          MAIA_EMBED_FORCE_HASH: "1"
        run: pytest tests/ -x --tb=short

  threshold-regression:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.12.4
        ports: ["6333:6333"]
        # NOTE: no `options:` healthcheck. The qdrant image ships no
        # curl/wget, so `--health-cmd "curl ..."` never succeeds && GitHub
        # marks the service `unhealthy` (all 4 qdrant jobs failed on this).
        # Readiness is polled runner-side in the "Wait for Qdrant" step.
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest
      - name: Wait for Qdrant
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:6333/healthz && break
            sleep 2
          done
          curl -sf http://localhost:6333/healthz
      - name: Ingest enterprise docs for evaluation
        run: |
          PYTHONPATH=src python -c "
          from maia.pipeline_query import ingest_data_dir
          from maia.config import settings
          settings.QDRANT_URL = 'http://localhost:6333'
          result = ingest_data_dir(settings.ENTERPRISE_DATA_DIR)
          print(f'Ingested: {result}')
          "
      - name: Run threshold sweep && check regression
        run: |
          PYTHONPATH=src python -m maia.benchmark_threshold --all --sweep-both --lock-thresholds > threshold_report.txt 2>&1
          cat threshold_report.txt
          # Extract locked thresholds
          LOCKED_SIM=$(grep "SIMILARITY_THRESHOLD = " threshold_report.txt | head -1 | awk '{print $NF}')
          LOCKED_AGENT=$(grep "AGENT_EVIDENCE_THRESHOLD = " threshold_report.txt | head -1 | awk '{print $NF}')
          echo "Locked SIMILARITY_THRESHOLD: $LOCKED_SIM"
          echo "Locked AGENT_EVIDENCE_THRESHOLD: $LOCKED_AGENT"
          # Compare with config.py values (allow 5% regression)
          CONFIG_SIM=0.3
          CONFIG_AGENT=0.3
          # For now just verify the script runs; full regression check when golden sets are stable
          echo "Threshold sweep completed successfully"
      - name: Run threshold regression test
        run: pytest tests/test_threshold_regression.py -v

  reranker:
    # WS3 decision (a): CrossEncoder rerank path validated in a dedicated job
    # (torch is heavy — kept out of the main unit-test install).
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.12.4
        ports: ["6333:6333"]
        # NOTE: no `options:` healthcheck. The qdrant image ships no
        # curl/wget, so `--health-cmd "curl ..."` never succeeds && GitHub
        # marks the service `unhealthy` (all 4 qdrant jobs failed on this).
        # Readiness is polled runner-side in the "Wait for Qdrant" step.
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies + rerank extra
        run: |
          pip install -r requirements.txt
          pip install -r requirements-rerank.txt
      - name: Wait for Qdrant
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:6333/healthz && break
            sleep 2
          done
          curl -sf http://localhost:6333/healthz
      - name: Ingest enterprise docs
        run: |
          PYTHONPATH=src python -c "
          from maia.pipeline_query import ingest_data_dir
          from maia.config import settings
          settings.QDRANT_URL = 'http://localhost:6333'
          result = ingest_data_dir(settings.ENTERPRISE_DATA_DIR)
          print(f'Ingested: {result}')
          "
      - name: Verify CrossEncoder rerank mode is active
        run: |
          PYTHONPATH=src python -c "
          from maia.reranker import get_reranker
          r = get_reranker()
          assert r.mode == \"cross-encoder\", f\"expected cross-encoder, got {r.mode}\"
          print('rerank mode:', r.mode)
          "
      - name: Run eval with cross-encoder && write manifest
        run: |
          PYTHONPATH=src python -m maia.eval --all --top-k 3 --manifest storage/manifests/

  eval-manifest:
    # WS7: persist eval run manifest as a CI artifact (reproducibility).
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.12.4
        ports: ["6333:6333"]
        # NOTE: no `options:` healthcheck. The qdrant image ships no
        # curl/wget, so `--health-cmd "curl ..."` never succeeds && GitHub
        # marks the service `unhealthy` (all 4 qdrant jobs failed on this).
        # Readiness is polled runner-side in the "Wait for Qdrant" step.
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Wait for Qdrant
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:6333/healthz && break
            sleep 2
          done
          curl -sf http://localhost:6333/healthz
      - name: Ingest enterprise docs
        run: |
          PYTHONPATH=src python -c "
          from maia.pipeline_query import ingest_data_dir
          from maia.config import settings
          settings.QDRANT_URL = 'http://localhost:6333'
          result = ingest_data_dir(settings.ENTERPRISE_DATA_DIR)
          print(f'Ingested: {result}')
          "
      - name: Run eval (hash mode = lower bound) with manifest
        env:
          MAIA_EMBED_FORCE_HASH: "1"
        run: |
          PYTHONPATH=src python -m maia.eval --all --top-k 3 --manifest storage/manifests/
      - name: Upload eval manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: eval-manifests
          path: storage/manifests/*.json

  contact-usability-gate:
    # G-04-FU2 gate: fail the build if the contact-usability survival score drops
    # below the lock (1.0) on a fresh enterprise ingestion.  Requires the
    # contact_usability evaluation group's golden set (data/is_contact_*) to be
    # committed.  Runs its own qdrant service so it is isolated from other jobs.
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.12.4
        ports: ["6333:6333"]
        # NOTE: no `options:` healthcheck. The qdrant image ships no
        # curl/wget, so `--health-cmd "curl ..."` never succeeds && GitHub
        # marks the service `unhealthy` (all 4 qdrant jobs failed on this).
        # Readiness is polled runner-side in the "Wait for Qdrant" step.
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Wait for Qdrant
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:6333/healthz && break
            sleep 2
          done
          curl -sf http://localhost:6333/healthz
      - name: Ingest enterprise docs
        run: |
          PYTHONPATH=src python -c "
          from maia.pipeline_query import ingest_data_dir
          from maia.config import settings
          settings.QDRANT_URL = 'http://localhost:6333'
          result = ingest_data_dir(settings.ENTERPRISE_DATA_DIR)
          print(f'Ingested: {result}')
          "
      - name: Contact usability gate (G-04-FU2, conditional survival = 1.0)
        run: |
          PYTHONPATH=src python -m maia.eval --group contact_usability --top-k 3 --fail-under-contact 1.0
  sonarcloud-analysis:
    # SonarCloud static analysis — runs on every push to main/develop.
    # Skipped gracefully (success) if SONAR_TOKEN secret is not configured,
    # so the CI pipeline still passes without blocking deployment.
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          pip install -r requirements.txt
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v3.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=imtarget05_MAIA-Intelligent-RAG-Knowledge-Platform
            -Dsonar.organization=imtarget05
            -Dsonar.sources=src
            -Dsonar.tests=tests
            -Dsonar.python.version=3.11,3.12
            -Dsonar.sourceEncoding=UTF-8
            -Dsonar.exclusions=**/__pycache__/**,**/*.pyc,**/*.egg-info/**
            -Dsonar.inclusions=src/**,tests/**
        continue-on-error: true

  deploy-production:
    # CD half of CI/CD — redeploy Render services via deploy hook on push to
    # main.  Skipped gracefully (no-op success) when RENDER_DEPLOY_HOOK_URL is
    # not set, so first-time deployers are not blocked.
    name: Deploy to Render (production)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Redeploy Render services via deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "⚠️  RENDER_DEPLOY_HOOK_URL not set — skipping Render redeploy."
            exit 0
          fi
          echo "Triggering Render redeploy..."
          HTTP_STATUS=$(curl -sS -o /dev/null -w "%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL")
          echo "Render deploy hook HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ] && [ "$HTTP_STATUS" != "202" ]; then
            echo "::warning::Render responded with HTTP $HTTP_STATUS (expected 200/202)."
          else
            echo "Render redeploy triggered successfully."
          fi
      - name: Post-deploy health check (best-effort)
        env:
          RENDER_API_BASE_URL: ${{ secrets.RENDER_API_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "$RENDER_API_BASE_URL" ]; then
            echo "No RENDER_API_BASE_URL — skipping health check."
            exit 0
          fi
          echo "Polling health: $RENDER_API_BASE_URL/health"
          for i in $(seq 1 12); do
            STATUS=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 10 "$RENDER_API_BASE_URL/health" || echo "000")
            echo "Health attempt $i: HTTP $STATUS"
            [ "$STATUS" = "200" ] && { echo "✅ Service healthy."; exit 0; }
            sleep 15
          done
          echo "::warning::Health check did not return 200 within 3 min."

  notify:
    # Discord notification on workflow completion.  Skipped (ok) if no
    # webhook secret is configured.
    name: Notify on completion
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-tests, threshold-regression, reranker, eval-manifest, contact-usability-gate, sonarcloud-analysis, deploy-production]
    if: always()
    steps:
      - name: Notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "No DISCORD_WEBHOOK_URL — skipping notification."
            exit 0
          fi
          # needs.<job>.result is exposed as JSON via NEEDS_JSON; any
          # non-success job flips the overall status to FAILED.
          FAILED_JOBS=$(echo "$NEEDS_JSON" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")')
          if [ -z "$FAILED_JOBS" ]; then
            NOTIFY_STATUS="SUCCESS"
            COLOR=0x00ff00
          else
            NOTIFY_STATUS="FAILED ($FAILED_JOBS)"
            COLOR=0xff0000
          fi
          TITLE="MAIA CI/CD $NOTIFY_STATUS"
          PAYLOAD=$(jq -n --arg content "**$TITLE** Branch: ${{ github.ref_name }} Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" '{content: $content}')
          curl -sS -X POST -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"
