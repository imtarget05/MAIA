name: IaC Validate

# The IaC gate. It runs infra/validate.sh against TERRAFORM: format check,
# init with no backend, validate root + modules, run the contract tests, prove
# the plan-invariant controls actually bite, and scan for committed secrets and
# real environment identifiers.
#
# RE-ANCHORED FROM BICEP. Every .bicep / .bicepparam file has been deleted from
# this repository; Terraform is the only IaC language here. This workflow no
# longer installs the Bicep CLI and no longer compiles ARM templates.
#
# THIS JOB DEPLOYS NOTHING. There is no Azure login, no az deployment and no
# federated credential in this workflow, and there is deliberately no
# `environment:` protection on it. A green run means "the templates are
# well-formed and the guards hold" — it is NOT evidence that any Azure resource
# exists. Deployment is a separate, explicitly authorised step, and claiming
# otherwise from a green check here is exactly the overclaim the evidence rules
# forbid.
#
# It is a separate workflow from ci.yml rather than another job in it, for two
# reasons: it needs no Python (so a Python dependency cannot break the IaC
# signal), and it triggers on infra/** alone, so a template change is validated
# in seconds instead of waiting behind the 1000-test suite.
on:
  push:
    branches: [main, develop]
    paths:
      - 'infra/**'
      - '.github/workflows/iac-validate.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'infra/**'
      - '.github/workflows/iac-validate.yml'
  workflow_dispatch:

# Same rationale as ci.yml: a newer commit makes older IaC conclusions
# irrelevant, so cancel rather than queue.
concurrency:
  group: iac-validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate, test and negative-control the Terraform
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # WHY setup-terraform and not a manual download: it puts the binary on
      # PATH so validate.sh's `command -v terraform` check is satisfied, and
      # validate.sh refuses to run without a CLI rather than skipping its own
      # checks, so this step is the only thing standing between a runner and a
      # silently-green job.
      #
      # The version is pinned so a Terraform release that changes a default or
      # tightens a validation cannot turn a green main red on an unrelated PR.
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.3

      - name: Run IaC validation
        run: ./infra/validate.sh

      # WHY the artifact is uploaded: the validation verdict is the evidence, and
      # "the job was green" is not reviewable by anyone who is not reading the
      # run log. It costs one file and makes the check auditable after the fact.
      #
      # WHY `validate -json` and NOT `plan`: a plan requires credentials and a
      # subscription, and this job deliberately has neither. The artifact is an
      # offline validation verdict, not a deployment preview.
      - name: Record the Terraform validation verdict
        if: always()
        run: |
          mkdir -p iac-artifact
          terraform -chdir=infra/terraform validate -json > iac-artifact/validate.json || true

      - name: Upload IaC artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iac-terraform-validation
          path: iac-artifact/
          retention-days: 30
