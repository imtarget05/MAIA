# Keepalive — defeats Render free-tier sleep (services spin down after ~15 min
# idle; the first request after sleep takes 30-60s cold start).
#
# This workflow pings the service /health URL every 14 minutes (inside the
# 15-min idle window) plus on manual dispatch. The URL comes from the
# RENDER_HEALTH_URL_MAIA secret (Settings → Secrets → Actions); the default
# below is a placeholder — replace it with the real service URL after the
# first Render deploy.
#
# Forks without GitHub Actions: use https://cron-job.org instead — create a
# free account, add a GET job to <your-service-url>/health every 14 minutes.
name: Keepalive

"on":
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch:

jobs:
  ping:
    name: Ping Render health endpoints
    runs-on: ubuntu-latest
    env:
      RENDER_HEALTH_URL_MAIA: ${{ secrets.RENDER_HEALTH_URL_MAIA }}
      RENDER_HEALTH_URL_MAIA_UI: ${{ secrets.RENDER_HEALTH_URL_MAIA_UI }}
    steps:
      - name: Ping maia-api + maia-ui (best-effort)
        run: |
          set -euo pipefail
          API_URL="${RENDER_HEALTH_URL_MAIA:-https://maia-api.onrender.com/health}"
          UI_URL="${RENDER_HEALTH_URL_MAIA_UI:-https://maia-ui.onrender.com/}"
          for URL in "$API_URL" "$UI_URL"; do
            echo "Pinging $URL"
            STATUS=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 "$URL" || echo "000")
            echo "→ HTTP $STATUS"
            if [ "$STATUS" != "200" ]; then
              echo "::warning::Keepalive ping to $URL returned HTTP $STATUS (expected 200)."
            else
              echo "Service awake."
            fi
          done
