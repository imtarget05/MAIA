[project]
name = "maia-rag"
version = "0.4.0"
requires-python = ">=3.12"
# Deliberately empty: this project installs from requirements.txt / the pinned
# requirements-*.txt files (see README "Install"). Do not duplicate the
# dependency set here — one source of truth only.
dependencies = []

[tool.pytest.ini_options]
# Cho pytest hiểu src-layout mà không cần sys.path.insert / PYTHONPATH=src
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "adversarial: prompt-injection / jailbreak / formula-injection attack tests",
  "race: concurrency / idempotency / double-run property tests",
  "live: tests requiring a live LLM gateway or model endpoint (skipped unless LIVE_TESTS=1)",
  "infra: tests requiring live infrastructure (DB, Qdrant, PLC); skipped unless LIVE_TESTS=1",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Repo policy (CI fix 2026-09-11): bare `ruff check src/` must be green and
# deterministic across ruff upgrades. The ignores below codify intentional
# codebase conventions (each verified, not drive-by suppressions):
# - B008: FastAPI Depends() in argument defaults is the framework idiom.
# - BLE001/S110/S112: broad-except resilience pattern (agent/loops must degrade
#   to mock/fallback, never crash the request path) — documented in handoff.
# - DTZ003/DTZ005: naive-UTC datetime convention for SQLite storage; switching
#   to tz-aware would break naive-vs-aware comparisons against DB values.
ignore = ["B008", "BLE001", "S110", "S112", "DTZ003", "DTZ005"]
