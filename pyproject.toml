[project]
name = "maia-rag"
version = "0.4.0"
requires-python = ">=3.12"
dependencies = []

[tool.pytest.ini_options]
# Cho pytest hiểu src-layout mà không cần sys.path.insert / PYTHONPATH=src
pythonpath = ["src"]
testpaths = ["tests"]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src"]

[tool.ruff]
target-version = "py312"
