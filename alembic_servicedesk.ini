[alembic]
script_location = alembic_servicedesk
prepend_sys_path = src
# URL is overridden by env.py from SD_DATABASE_URL / test configuration.
sqlalchemy.url = postgresql+psycopg://servicedesk:servicedesk@localhost:5433/servicedesk

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
