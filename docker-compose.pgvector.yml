# pgvector alternative backend (opt-in, Byte JD "Vector DB" breadth)
# Usage: QDRANT_URL=... is default. For Postgres+pgvector instead:
#   docker compose -f docker-compose.yml -f docker-compose.pgvector.yml up -d pgvector
#   DATABASE_URL=postgresql://maia:maia@localhost:5433/maia PGVector_COLLECTION=maia_chunks \
#     .venv/bin/python scripts/migrate_qdrant_to_pgvector.py  # one-way backfill (TODO)
# Status: infra standby only — app code still uses QdrantStore. Switching the
# retrieval path to pgvector is tracked work (see docs/adr/0002-vector-backend.md).
services:
  pgvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: maia
      POSTGRES_PASSWORD: maia
      POSTGRES_DB: maia
    ports:
      - "5433:5432"
    volumes:
      - pgvector-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maia"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgvector-data:
